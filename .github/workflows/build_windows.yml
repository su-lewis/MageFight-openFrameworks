name: Build Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OF_VER: 0.12.0
  OF_ROOT: ${{ github.workspace }}\openFrameworks

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Your Game
        uses: actions/checkout@v3
        with:
          path: temp_game_code

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Download OpenFrameworks
        shell: cmd
        run: |
          curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/${{ env.OF_VER }}/of_v${{ env.OF_VER }}_vs_release.zip
          7z x of.zip -o"${{ github.workspace }}" -y
          ren "${{ github.workspace }}\of_v${{ env.OF_VER }}_vs_release" openFrameworks

      - name: Move Game into OpenFrameworks
        shell: cmd
        run: |
          echo Moving game code into the engine structure...
          mkdir "${{ env.OF_ROOT }}\apps\myApps\MageFight"
          robocopy "${{ github.workspace }}\temp_game_code" "${{ env.OF_ROOT }}\apps\myApps\MageFight" /E /MOVE /NFL /NDL /NJH /NJS || ver > nul

      - name: Download Project Generator
        shell: cmd
        run: |
          :: Download to a dedicated temp folder to avoid confusion
          mkdir pg_temp
          cd pg_temp
          curl -L -o pg.zip https://github.com/openframeworks/projectGenerator/releases/download/nightly/projectGenerator-vs.zip
          7z x pg.zip -y

      - name: Generate Project Files (Dynamic Search)
        shell: cmd
        run: |
          :: Find the .exe wherever it extracted
          cd pg_temp
          for /f "delims=" %%F in ('dir /s /b projectGenerator.exe') do set "PG_EXE=%%F"
          
          echo Found Project Generator at: %PG_EXE%
          
          :: Run it using the found path
          "%PG_EXE%" /ofPath:"${{ env.OF_ROOT }}" /platforms:vs "${{ env.OF_ROOT }}\apps\myApps\MageFight"

      - name: Inject Steam Headers & Libs
        shell: cmd
        run: |
          echo Copying Steam Headers...
          xcopy "${{ env.OF_ROOT }}\apps\myApps\MageFight\libs\steam\include\steam" "${{ env.OF_ROOT }}\libs\openFrameworks\steam\" /E /I /Y
          
          echo Copying Steam Lib...
          copy "${{ env.OF_ROOT }}\apps\myApps\MageFight\libs\steam\lib\win64\steam_api64.lib" "${{ env.OF_ROOT }}\libs\openFrameworksCompiled\lib\vs\x64\"

      - name: Build
        working-directory: ${{ env.OF_ROOT }}\apps\myApps\MageFight
        shell: cmd
        run: |
          msbuild MageFight.sln /p:configuration=Release /p:platform=x64

      - name: Collect Artifacts
        shell: cmd
        run: |
          mkdir ReleaseBuild
          copy "${{ env.OF_ROOT }}\apps\myApps\MageFight\bin\MageFight.exe" ReleaseBuild\
          copy "${{ env.OF_ROOT }}\apps\myApps\MageFight\libs\steam\lib\win64\steam_api64.dll" ReleaseBuild\
          copy "${{ env.OF_ROOT }}\apps\myApps\MageFight\bin\steam_appid.txt" ReleaseBuild\
          copy "${{ env.OF_ROOT }}\export\vs\x64\*.dll" ReleaseBuild\
          xcopy "${{ env.OF_ROOT }}\apps\myApps\MageFight\bin\data" ReleaseBuild\data /E /I

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: MageFight_Windows
          path: ReleaseBuild/