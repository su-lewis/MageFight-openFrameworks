name: Build Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OF_VER: 0.12.0
  # We will define roots relative to the workspace for cleaner handling
  OF_DIR: openFrameworks

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Your Game
        uses: actions/checkout@v3
        with:
          path: temp_game_code

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Download OpenFrameworks
        shell: cmd
        run: |
          curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/${{ env.OF_VER }}/of_v${{ env.OF_VER }}_vs_release.zip
          7z x of.zip -o"${{ github.workspace }}" -y
          ren "${{ github.workspace }}\of_v${{ env.OF_VER }}_vs_release" ${{ env.OF_DIR }}

      - name: Move Game into OpenFrameworks
        shell: cmd
        run: |
          echo Moving game code into the engine structure...
          mkdir "${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight"
          robocopy "${{ github.workspace }}\temp_game_code" "${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight" /E /MOVE /NFL /NDL /NJH /NJS || ver > nul

      - name: Download Project Generator
        shell: cmd
        run: |
          mkdir pg_temp
          cd pg_temp
          curl -L -o pg.zip https://github.com/openframeworks/projectGenerator/releases/download/nightly/projectGenerator-vs.zip
          7z x pg.zip -y

      - name: Generate Project Files (Relative Path Fix)
        shell: cmd
        run: |
          :: Find the PG executable
          cd pg_temp
          for /f "delims=" %%F in ('dir /s /b projectGenerator.exe') do set "PG_EXE=%%F"
          
          :: CRITICAL FIX: Go into the OF root folder so we can use simple relative paths
          cd "${{ github.workspace }}\${{ env.OF_DIR }}"
          
          echo Running PG from: %CD%
          echo Target: apps\myApps\MageFight
          
          :: Run using relative path. -o "." means "Current Directory is the engine"
          "%PG_EXE%" -o "." -p vs "apps\myApps\MageFight"

      - name: Inject Steam Headers & Libs
        shell: cmd
        run: |
          echo Copying Steam Headers...
          xcopy "${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight\libs\steam\include\steam" "${{ github.workspace }}\${{ env.OF_DIR }}\libs\openFrameworks\steam\" /E /I /Y
          
          echo Copying Steam Lib...
          copy "${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight\libs\steam\lib\win64\steam_api64.lib" "${{ github.workspace }}\${{ env.OF_DIR }}\libs\openFrameworksCompiled\lib\vs\x64\"

      - name: Build
        working-directory: ${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight
        shell: cmd
        run: |
          msbuild MageFight.sln /p:configuration=Release /p:platform=x64

      - name: Collect Artifacts
        shell: cmd
        run: |
          mkdir ReleaseBuild
          set "GAME_ROOT=${{ github.workspace }}\${{ env.OF_DIR }}\apps\myApps\MageFight"
          
          copy "%GAME_ROOT%\bin\MageFight.exe" ReleaseBuild\
          copy "%GAME_ROOT%\libs\steam\lib\win64\steam_api64.dll" ReleaseBuild\
          copy "%GAME_ROOT%\bin\steam_appid.txt" ReleaseBuild\
          copy "${{ github.workspace }}\${{ env.OF_DIR }}\export\vs\x64\*.dll" ReleaseBuild\
          xcopy "%GAME_ROOT%\bin\data" ReleaseBuild\data /E /I

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: MageFight_Windows
          path: ReleaseBuild/