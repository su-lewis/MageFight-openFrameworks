name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          unzip
          curl
          rsync

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo

    # BUMPED TO V2: This forces GitHub to delete the old cache and run our new fixes!
    - name: Cache openFrameworks Framework
      id: cache-of
      uses: actions/cache@v4
      with:
        path: openFrameworks
        key: openframeworks-core-v2

    - name: Download, Patch, and Build Core OF
      if: steps.cache-of.outputs.cache-hit != 'true'
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks

        # --- THE GLOBAL BOOST NUKE ---
        # This scans every single .mk config file in the framework and rips out the -mt
        find openFrameworks -type f -name "*.mk" -exec sed -i 's/-lboost_system-mt/-lboost_system/g' {} +
        find openFrameworks -type f -name "*.mk" -exec sed -i 's/-lboost_filesystem-mt/-lboost_filesystem/g' {} +

        cd openFrameworks/scripts/msys2
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk

        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    # 4. ALWAYS RESTORE ENV: The GitHub runner is a fresh PC every time.
    - name: Restore MSYS2 Environment
      run: |
        cd openFrameworks/scripts/msys2
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        # GLM Fix
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        # THE TROJAN HORSE: Instead of fighting the Makefiles, we just duplicate
        # the modern Boost files and give the copies the "-mt" name oF is begging for!
        cp /mingw64/lib/libboost_system.a /mingw64/lib/libboost_system-mt.a || true
        cp /mingw64/lib/libboost_system.dll.a /mingw64/lib/libboost_system-mt.dll.a || true
        cp /mingw64/lib/libboost_filesystem.a /mingw64/lib/libboost_filesystem-mt.a || true
        cp /mingw64/lib/libboost_filesystem.dll.a /mingw64/lib/libboost_filesystem-mt.dll.a || true

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps/MageFight
        rsync -a my_game_repo/ openFrameworks/apps/myApps/MageFight/

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        make Release -j4

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows
        path: openFrameworks/apps/myApps/MageFight/bin/
