name: Build Windows EXE

on:
  workflow_dispatch: # This is the magic word for "Manual Trigger Only"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          mingw-w64-x86_64-tools
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          unzip
          curl
          rsync

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo
        fetch-depth: 0  # <--- CRITICAL: Downloads full git history so we can generate the changelog

    - name: Cache openFrameworks Framework
      id: cache-of
      uses: actions/cache@v4
      with:
        path: openFrameworks
        key: ${{ runner.os }}-of-0.12.0-core-v3

    - name: Download, Patch, and Build Core OF
      if: steps.cache-of.outputs.cache-hit != 'true'
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks
        cd openFrameworks/scripts/msys2
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF
        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk
        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    - name: Restore MSYS2 Environment
      run: |
        cd openFrameworks/scripts/msys2
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps/MageFight
        rsync -a --delete my_game_repo/ openFrameworks/apps/myApps/MageFight/

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        mkdir -p bin
        cd bin
        echo "Forging Steamworks Library..."
        gendef steam_api64.dll
        dlltool -d steam_api64.def -D steam_api64.dll -l libsteam_api64.a
        echo "Forging FMOD Library..."
        gendef fmod.dll
        dlltool -d fmod.def -D fmod.dll -l libfmod.a
        echo "Forging Dummy Boost Libraries..."
        echo "void dummy_boost() {}" > dummy.cpp
        g++ -c dummy.cpp
        ar rcs libboost_system-mt.a dummy.o
        ar rcs libboost_filesystem-mt.a dummy.o
        rm dummy.cpp dummy.o
        cd ..
        make Release -j4

    - name: Package Dependencies and Clean Up
      run: |
        cd openFrameworks/apps/myApps/MageFight/bin
        echo "Copying required MSYS2 DLLs..."
        ldd MageFight.exe | grep -o '/mingw64/bin/[^ ]*\.dll' | xargs -I{} cp "{}" .
        
        echo "Forcing steam_appid.txt generation..."
        echo "4329880" > steam_appid.txt
        
        echo "Cleaning up Linux files and compiler stubs..."
        find . -name "*.so*" -type f -delete
        find . -name "*.a" -type f -delete
        find . -name "*.def" -type f -delete
        rm -f run.sh runsteam.sh Makefile
        
        echo "Done! The folder is now perfectly clean for Windows."

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows-Release
        path: openFrameworks/apps/myApps/MageFight/bin/
        retention-days: 1

    - name: Send Changelog to Discord
      if: success()
      shell: bash # Use standard Git Bash so the GitHub CLI (`gh`) and `jq` work natively
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        # We must cd into the repo because we downloaded it to the "my_game_repo" subfolder
        cd my_game_repo
        
        # 1. Ask GitHub API for the commit hash of the LAST SUCCESSFUL run of this exact workflow
        LAST_SHA=$(gh run list --workflow "${{ github.workflow }}" --status success --json headSha --jq '[.[].headSha | select(. != "${{ github.sha }}")][0]')

        # 2. Extract commit messages between that old build and this new build
        if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" == "null" ]; then
          echo "No previous successful build found. Falling back to last 5 commits."
          COMMITS=$(git log -n 5 --no-merges --pretty=format:"• %s (\`%h\`)")
        else
          echo "Comparing $LAST_SHA to HEAD..."
          COMMITS=$(git log ${LAST_SHA}..HEAD --no-merges --pretty=format:"• %s (\`%h\`)")
        fi

        if [ -z "$COMMITS" ]; then
          COMMITS="*No new commits since last build.*"
        fi

        # 3. Format the JSON safely using jq (prevents quotes/newlines from breaking the API call)
        PAYLOAD=$(jq -n --arg content "🚀 **New Windows Build Compiled!**\n\n**Recent Changes:**\n$COMMITS" '{content: $content}')

        # 4. Send the payload to Discord
        curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"