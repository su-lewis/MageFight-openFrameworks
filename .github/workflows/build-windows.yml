name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    # 1. Setup MSYS2 (Cached)
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          unzip
          curl
          rsync

    # 2. Checkout Game Code
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo

    # 3. Cache openFrameworks Framework
    - name: Cache openFrameworks Framework
      id: cache-of
      uses: actions/cache@v4
      with:
        path: openFrameworks
        key: openframeworks-core-v2

    # 4. Download, Patch, and Build Core OF
    - name: Download, Patch, and Build Core OF
      if: steps.cache-of.outputs.cache-hit != 'true'
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks

        cd openFrameworks/scripts/msys2
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk

        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    # 5. Restore MSYS2 Environment
    - name: Restore MSYS2 Environment
      run: |
        cd openFrameworks/scripts/msys2
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

    # 6. SYNC GAME CODE
    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps/MageFight
        rsync -a my_game_repo/ openFrameworks/apps/myApps/MageFight/

    # 7. FAST COMPILE
    - name: Build MageFight
      run: |
        # THE GHOST FLAG FIX: Erase Boost from the core framework
        sed -i 's/-lboost_system-mt//g' openFrameworks/libs/openFrameworksCompiled/project/msys2/config.msys2.default.mk
        sed -i 's/-lboost_system//g' openFrameworks/libs/openFrameworksCompiled/project/msys2/config.msys2.default.mk
        sed -i 's/-lboost_filesystem-mt//g' openFrameworks/libs/openFrameworksCompiled/project/msys2/config.msys2.default.mk
        sed -i 's/-lboost_filesystem//g' openFrameworks/libs/openFrameworksCompiled/project/msys2/config.msys2.default.mk

        cd openFrameworks/apps/myApps/MageFight

        # Force the GCC compiler to link your external libraries!
        make Release -j4 PROJECT_LDFLAGS="libs/steam/lib/win64/steam_api64.lib libs/fmod/win64/fmod.dll"

    # 8. UPLOAD
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows
        path: openFrameworks/apps/myApps/MageFight/bin/
