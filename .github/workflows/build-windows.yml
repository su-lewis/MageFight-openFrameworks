name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          unzip
          curl
          rsync

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo

    - name: Download openFrameworks
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks

# 4. Install dependencies and apply MSYS2 fixes
    - name: Install oF Dependencies & MSYS2 Fixes
      run: |
        cd openFrameworks/scripts/msys2

        # Fix 1: FreeImage capitalization change in MSYS2
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh

        # Run the official installer
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        # Fix 2: GLM recently removed their pkg-config file in MSYS2.
        # We manually generate a replacement receipt so openFrameworks can find it!
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include

        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps
        mv my_game_repo openFrameworks/apps/myApps/MageFight

   # 6. Build the core openFrameworks library.
    - name: Build Core openFrameworks Library
      run: |
        # Inject the GLM experimental flag into the core oF makefile
        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> openFrameworks/libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk

        cd openFrameworks/libs/openFrameworksCompiled/project
        make Release -j4

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        make Release -j4

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows
        path: openFrameworks/apps/myApps/MageFight/bin/
