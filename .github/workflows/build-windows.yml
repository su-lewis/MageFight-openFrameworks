name: Build Windows EXE

on:
  workflow_dispatch: # Manual Trigger Only

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo
        fetch-depth: 0

    - name: Download & Extract Frozen Toolchain
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = "Stop"

        gh release download toolchain-mingw64-v1 -R "${{ github.repository }}" -p "msys64-mingw64.tar.7z" -p "openFrameworks-0.12.0-mingw64.tar.7z" -D "$env:RUNNER_TEMP"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\msys64" | Out-Null
        7z x "$env:RUNNER_TEMP\msys64-mingw64.tar.7z" "-o$env:RUNNER_TEMP" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "C:\Program Files\Git\usr\bin\tar.exe" -xf "$env:RUNNER_TEMP\msys64.tar" -C "$env:RUNNER_TEMP\msys64"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item "$env:RUNNER_TEMP\msys64-mingw64.tar.7z", "$env:RUNNER_TEMP\msys64.tar"

        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\openFrameworks" | Out-Null
        7z x "$env:RUNNER_TEMP\openFrameworks-0.12.0-mingw64.tar.7z" "-o$env:RUNNER_TEMP" -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "C:\Program Files\Git\usr\bin\tar.exe" -xf "$env:RUNNER_TEMP\of.tar" -C "$env:GITHUB_WORKSPACE\openFrameworks"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item "$env:RUNNER_TEMP\openFrameworks-0.12.0-mingw64.tar.7z", "$env:RUNNER_TEMP\of.tar"

        $wrapDir = "$env:RUNNER_TEMP\msys2-wrap"
        New-Item -ItemType Directory -Force -Path $wrapDir | Out-Null
        @"
        @echo off
        set MSYSTEM=MINGW64
        set CHERE_INVOKING=1
        "$env:RUNNER_TEMP\msys64\usr\bin\bash.exe" -leo pipefail %*
        "@ | Set-Content -Path "$wrapDir\msys2.cmd" -Encoding ASCII
        Add-Content -Path $env:GITHUB_PATH -Value $wrapDir

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps/MageFight
        rsync -a --no-perms --exclude='.git' --delete my_game_repo/ openFrameworks/apps/myApps/MageFight/

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        mkdir -p bin
        cd bin

        echo "Forging Full Steamworks Library Import Library..."
        cat << 'EOF' > steam_api64.def
        LIBRARY steam_api64.dll
        EXPORTS
        SteamAPI_Init
        SteamAPI_RunCallbacks
        SteamAPI_Shutdown
        SteamAPI_IsSteamRunning
        SteamAPI_GetHSteamUser
        SteamAPI_GetHSteamPipe
        SteamAPI_ManualDispatch_Init
        SteamAPI_ManualDispatch_RunFrame
        SteamAPI_ManualDispatch_GetNextCallback
        SteamAPI_ManualDispatch_GetAPICallResult
        SteamAPI_ManualDispatch_FreeLastCallback
        SteamInternal_SteamAPI_Init
        SteamInternal_ContextInit
        SteamInternal_FindOrCreateUserInterface
        SteamInternal_FindOrCreateGameServerInterface
        SteamClient
        SteamUser
        SteamFriends
        SteamUtils
        SteamMatchmaking
        SteamUserStats
        SteamApps
        SteamNetworking
        SteamRemoteStorage
        SteamHTTP
        SteamController
        SteamUGC
        SteamAppList
        SteamMusic
        SteamMusicRemote
        SteamHTMLSurface
        SteamInventory
        SteamVideo
        SteamParentalSettings
        SteamAPI_ISteamUser_GetSteamID
        SteamAPI_ISteamUserStats_GetStatInt32
        SteamAPI_ISteamUserStats_SetStatInt32
        SteamAPI_ISteamUserStats_StoreStats
        SteamAPI_ISteamUserStats_RequestUserStats
        SteamAPI_ISteamUserStats_FindLeaderboard
        SteamAPI_ISteamUserStats_DownloadLeaderboardEntries
        SteamAPI_ISteamUserStats_GetDownloadedLeaderboardEntry
        SteamAPI_ISteamUserStats_UploadLeaderboardScore
        SteamAPI_ISteamApps_BIsSubscribed
        SteamAPI_ISteamApps_GetLaunchCommandLine
        SteamAPI_ISteamMatchmaking_CreateLobby
        SteamAPI_ISteamMatchmaking_GetLobbyOwner
        SteamAPI_ISteamMatchmaking_SetLobbyData
        SteamAPI_ISteamMatchmaking_GetLobbyData
        SteamAPI_ISteamMatchmaking_JoinLobby
        SteamAPI_ISteamMatchmaking_LeaveLobby
        SteamAPI_ISteamMatchmaking_GetLobbyByIndex
        SteamAPI_ISteamMatchmaking_GetNumLobbyMembers
        SteamAPI_ISteamMatchmaking_GetLobbyMemberLimit
        SteamAPI_ISteamMatchmaking_RequestLobbyList
        SteamAPI_ISteamMatchmaking_AddRequestLobbyListResultCountFilter
        SteamAPI_ISteamMatchmaking_AddRequestLobbyListDistanceFilter
        SteamAPI_ISteamMatchmaking_AddRequestLobbyListStringFilter
        SteamAPI_ISteamNetworkingSockets_ConnectP2P
        SteamAPI_ISteamNetworkingSockets_SendMessageToConnection
        SteamAPI_ISteamNetworkingSockets_CreateListenSocketP2P
        SteamAPI_ISteamNetworkingSockets_CloseConnection
        SteamAPI_ISteamNetworkingSockets_CloseListenSocket
        SteamAPI_ISteamNetworkingSockets_AcceptConnection
        SteamAPI_ISteamNetworkingSockets_ReceiveMessagesOnConnection
        SteamAPI_ISteamNetworkingUtils_InitRelayNetworkAccess
        SteamAPI_SteamNetworkingMessage_t_Release
        SteamAPI_ISteamFriends_GetPersonaName
        SteamAPI_ISteamFriends_GetFriendPersonaName
        SteamAPI_ISteamFriends_GetSmallFriendAvatar
        SteamAPI_ISteamFriends_GetMediumFriendAvatar
        SteamAPI_ISteamFriends_GetLargeFriendAvatar
        SteamAPI_ISteamFriends_SetRichPresence
        SteamAPI_ISteamFriends_ActivateGameOverlayInviteDialog
        SteamAPI_ISteamUtils_GetImageSize
        SteamAPI_ISteamUtils_GetImageRGBA
        EOF
        dlltool -d steam_api64.def -D steam_api64.dll -l libsteam_api64.a

        echo "Forging FMOD Library Import Library..."
        cat << 'EOF' > fmod.def
        LIBRARY fmod.dll
        EXPORTS
        FMOD_System_Create
        FMOD_System_Init
        FMOD_System_Close
        FMOD_System_Release
        FMOD_System_Update
        FMOD_System_CreateSound
        FMOD_System_CreateStream
        FMOD_System_PlaySound
        FMOD_Sound_Release
        FMOD_Sound_GetLength
        FMOD_Channel_Stop
        FMOD_Channel_IsPlaying
        FMOD_Channel_SetPaused
        FMOD_Channel_GetPaused
        FMOD_Channel_SetVolume
        FMOD_Channel_GetVolume
        FMOD_Channel_SetPitch
        FMOD_Channel_GetPitch
        FMOD_Channel_SetPan
        FMOD_Channel_SetFrequency
        FMOD_Channel_GetFrequency
        FMOD_Channel_SetPosition
        FMOD_Channel_GetPosition
        FMOD_Channel_SetMode
        FMOD_Channel_SetLoopCount
        EOF
        dlltool -d fmod.def -D fmod.dll -l libfmod.a

        echo "Forging Dummy Boost Libraries..."
        echo "void dummy_boost() {}" > dummy.cpp
        g++ -c dummy.cpp
        ar rcs libboost_system-mt.a dummy.o
        ar rcs libboost_filesystem-mt.a dummy.o
        rm dummy.cpp dummy.o

        cd ..
        make Release -j4

    - name: Package Dependencies and Clean Up
      run: |
        cd openFrameworks/apps/myApps/MageFight/bin
        echo "Copying required MSYS2 DLLs..."
        ldd MageFight.exe | grep -o '/mingw64/bin/[^ ]*\.dll' | sort -u | xargs -I{} cp "{}" .
        echo "Checking for any missing DLLs:"
        ldd MageFight.exe | grep -i "not found" && exit 1 || true

        echo "Forcing steam_appid.txt generation..."
        echo "4329880" > steam_appid.txt

        echo "Copying credits.txt..."
        cp ../credits.txt . 2>/dev/null || cp data/credits.txt . 2>/dev/null || true

        echo "Cleaning up Linux files and compiler stubs..."
        find . -name "*.so*" -type f -delete
        find . -name "*.a" -type f -delete
        find . -name "*.def" -type f -delete
        rm -f run.sh runsteam.sh Makefile

        echo "Done! The folder is now perfectly clean for Windows."

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows-Release
        path: openFrameworks/apps/myApps/MageFight/bin/
        retention-days: 1

    - name: Send Changelog to Discord
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        cd my_game_repo

        export CURRENT_DATE=$(date +"%Y-%m-%d %H:%M")

        LAST_SHA=$(gh run list --workflow "${{ github.workflow }}" --status success --json headSha --jq '[.[].headSha | select(. != "${{ github.sha }}")][0]')

        if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" == "null" ]; then
          echo "No previous successful build found. Falling back to last 5 commits."
          export RAW_COMMITS=$(git log -n 5 --no-merges --pretty=format:"- %s")
        else
          echo "Comparing $LAST_SHA to HEAD..."
          export RAW_COMMITS=$(git log ${LAST_SHA}..HEAD --no-merges --pretty=format:"- %s")
        fi

        if [ -z "$RAW_COMMITS" ]; then
          export RAW_COMMITS="- No new commits since last build."
        fi

        PAYLOAD=$(jq -n '{content: ("**" + $ENV.CURRENT_DATE + "**\n\nRecent Changes:\n" + $ENV.RAW_COMMITS)}')

        curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"