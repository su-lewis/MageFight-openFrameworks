name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    # 1. Setup MSYS2 Environment (Cached automatically)
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          unzip
          curl
          rsync

    # 2. Checkout Game Code
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo

    # 3. Cache openFrameworks Build
    - name: Cache openFrameworks Build
      id: cache-of
      uses: actions/cache@v4
      with:
        path: openFrameworks
        key: ${{ runner.os }}-of-0.12.0-core-v2

    # 4. Download, Patch, and Build Core OF (ONLY if cache misses)
    - name: Download, Patch, and Build Core OF
      if: steps.cache-of.outputs.cache-hit != 'true'
      run: |
        echo "Cache miss. Building openFrameworks from scratch..."

        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks

        cd openFrameworks/scripts/msys2

        # THE MODERN FREEIMAGE FIX: Avoid the 404 dead link by just replacing the capitalization
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh

        # Install dependencies (This will now correctly grab lowercase freeimage + boost)
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        # GLM FIX: Create the missing pkg-config file
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        # Inject the modern GLM experimental flag
        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk

        # Build the core OF library
        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    # 5. Sync Project Directory
    - name: Setup Project Directory
      run: |
        rsync -a my_game_repo/ openFrameworks/apps/myApps/MageFight/

    # 6. Compile MageFight (Trusting config.make!)
    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        make Release -j4

    # 7. Upload Artifact
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows
        path: openFrameworks/apps/myApps/MageFight/bin/
