name: Build Windows EXE

on:
  workflow_dispatch: # Manual Trigger Only

jobs:
  build-windows:
    runs-on: windows-latest
    
    permissions:
      contents: read
      actions: read 

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          mingw-w64-x86_64-tools
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          unzip
          curl
          rsync

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo
        fetch-depth: 0

    - name: Cache openFrameworks Framework
      id: cache-of
      uses: actions/cache@v4
      with:
        path: openFrameworks
        key: ${{ runner.os }}-of-0.12.0-core-v6

    - name: Download, Patch, and Build Core OF
      if: steps.cache-of.outputs.cache-hit != 'true'
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks
        cd openFrameworks/scripts/msys2
        
        # Patch renamed FreeImage and dropped rtaudio packages from pacman dependency list
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*rtaudio[^[:space:]]*//gI' install_dependencies.sh
        
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm
        
        # 1. Create glm.pc stub
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        # 2. Provide a stub rtaudio.pc and dummy static library
        cat << 'EOF' > /mingw64/lib/pkgconfig/rtaudio.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: rtaudio
        Description: RtAudio dummy
        Version: 5.2.0
        Libs:
        Cflags:
        EOF
        ar cr /mingw64/lib/librtaudio.a

        # 3. Clean rtaudio from makefiles
        find ../../libs/openFrameworksCompiled/ -type f -name "*.mk" -exec sed -i -E 's/[^[:space:]]*rtaudio[^[:space:]]*//gI' {} +

        # 4. Disable OF_SOUNDSTREAM_RTAUDIO across all headers so OF uses ofNullSoundStream
        find ../../libs/openFrameworks/ -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#define OF_SOUNDSTREAM_RTAUDIO/\/\/#define OF_SOUNDSTREAM_RTAUDIO/g' {} +

        # 5. Disable ofRtAudioSoundStream implementation entirely
        echo "#if 0" > temp_rt.cpp
        cat ../../libs/openFrameworks/sound/ofRtAudioSoundStream.cpp >> temp_rt.cpp
        echo "#endif" >> temp_rt.cpp
        mv temp_rt.cpp ../../libs/openFrameworks/sound/ofRtAudioSoundStream.cpp

        # 6. Stub ofRtAudioSoundStream class declaration to prevent missing-type errors
        cat << 'EOF' > ../../libs/openFrameworks/sound/ofRtAudioSoundStream.h
        #pragma once
        #include "ofBaseSoundStream.h"
        class ofRtAudioSoundStream : public ofBaseSoundStream {
        public:
            bool setup(const ofSoundStreamSettings& settings) override { return true; }
            void start() override {}
            void stop() override {}
            void close() override {}
            uint64_t getTickCount() const override { return 0; }
            int getNumInputChannels() const override { return 0; }
            int getNumOutputChannels() const override { return 0; }
            int getSampleRate() const override { return 44100; }
            int getBufferSize() const override { return 512; }
            std::vector<ofSoundDevice> getDeviceList(ofSoundDevice::Api) const override { return {}; }
            void setDeviceID(int) override {}
            void setInDeviceID(int) override {}
            void setOutDeviceID(int) override {}
        };
        EOF

        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk
        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    - name: Restore MSYS2 Environment
      run: |
        cd openFrameworks/scripts/msys2
        
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*rtaudio[^[:space:]]*//gI' install_dependencies.sh
        
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm
        
        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        cat << 'EOF' > /mingw64/lib/pkgconfig/rtaudio.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: rtaudio
        Description: RtAudio dummy
        Version: 5.2.0
        Libs:
        Cflags:
        EOF
        ar cr /mingw64/lib/librtaudio.a

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps/MageFight
        rsync -a --no-perms --exclude='.git' --delete my_game_repo/ openFrameworks/apps/myApps/MageFight/

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        mkdir -p bin
        cd bin
        echo "Forging Steamworks Library..."
        gendef steam_api64.dll
        dlltool -d steam_api64.def -D steam_api64.dll -l libsteam_api64.a
        echo "Forging FMOD Library..."
        gendef fmod.dll
        dlltool -d fmod.def -D fmod.dll -l libfmod.a
        echo "Forging Dummy Boost Libraries..."
        echo "void dummy_boost() {}" > dummy.cpp
        g++ -c dummy.cpp
        ar rcs libboost_system-mt.a dummy.o
        ar rcs libboost_filesystem-mt.a dummy.o
        rm dummy.cpp dummy.o
        cd ..
        make Release -j4

    - name: Package Dependencies and Clean Up
      run: |
        cd openFrameworks/apps/myApps/MageFight/bin
        echo "Copying required MSYS2 DLLs..."
        ldd MageFight.exe | grep -o '/mingw64/bin/[^ ]*\.dll' | xargs -I{} cp "{}" .
        
        echo "Forcing steam_appid.txt generation..."
        echo "4329880" > steam_appid.txt

        echo "Copying credits.txt..."
        cp ../credits.txt . 2>/dev/null || cp data/credits.txt . 2>/dev/null || true
        
        echo "Cleaning up Linux files and compiler stubs..."
        find . -name "*.so*" -type f -delete
        find . -name "*.a" -type f -delete
        find . -name "*.def" -type f -delete
        rm -f run.sh runsteam.sh Makefile
        
        echo "Done! The folder is now perfectly clean for Windows."

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows-Release
        path: openFrameworks/apps/myApps/MageFight/bin/
        retention-days: 1

    - name: Send Changelog to Discord
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        cd my_game_repo
        
        export CURRENT_DATE=$(date +"%Y-%m-%d %H:%M")
        
        LAST_SHA=$(gh run list --workflow "${{ github.workflow }}" --status success --json headSha --jq '[.[].headSha | select(. != "${{ github.sha }}")][0]')

        if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" == "null" ]; then
          echo "No previous successful build found. Falling back to last 5 commits."
          export RAW_COMMITS=$(git log -n 5 --no-merges --pretty=format:"- %s")
        else
          echo "Comparing $LAST_SHA to HEAD..."
          export RAW_COMMITS=$(git log ${LAST_SHA}..HEAD --no-merges --pretty=format:"- %s")
        fi

        if [ -z "$RAW_COMMITS" ]; then
          export RAW_COMMITS="- No new commits since last build."
        fi

        PAYLOAD=$(jq -n '{content: ("**" + $ENV.CURRENT_DATE + "**\n\nRecent Changes:\n" + $ENV.RAW_COMMITS)}')

        curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"