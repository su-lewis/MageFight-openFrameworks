name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          unzip
          curl
          rsync

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: my_game_repo

    - name: Download openFrameworks
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks

# 4. Install dependencies, including the manual fix for the lowercase freeimage library
    - name: Install oF Dependencies & FreeImage Fix
      run: |
        cd openFrameworks/scripts/msys2

        # OpenFrameworks 0.12.0 asks for "FreeImage" (capital F).
        # MSYS2 renamed it to "freeimage" (lowercase).
        # This sledgehammer command just finds and replaces the capitalization!
        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh

        # Run the official installer (it will now correctly ask for the lowercase version)
        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

    - name: Setup Project Directory
      run: |
        mkdir -p openFrameworks/apps/myApps
        mv my_game_repo openFrameworks/apps/myApps/MageFight

    - name: Build Core openFrameworks Library
      run: |
        cd openFrameworks/libs/openFrameworksCompiled/project
        make Release -j4

    - name: Build MageFight
      run: |
        cd openFrameworks/apps/myApps/MageFight
        make Release -j4

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MageFight-Windows
        path: openFrameworks/apps/myApps/MageFight/bin/
