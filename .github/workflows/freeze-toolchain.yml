name: Freeze Windows Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-toolchain:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Setup MSYS2
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: false
        suppress-deprecation-warnings: msystem-mingw64
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-wget
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          unzip
          curl
          rsync

    - name: Build and Install GLFW3 from Source
      run: |
        curl -fL -o glfw-3.5.1.tar.gz https://github.com/glfw/glfw/archive/refs/tags/3.5.1.tar.gz
        tar -xzf glfw-3.5.1.tar.gz
        cmake -S glfw-3.5.1 -B glfw-build -G Ninja \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DGLFW_BUILD_EXAMPLES=OFF \
          -DGLFW_BUILD_TESTS=OFF \
          -DGLFW_BUILD_DOCS=OFF
        cmake --build glfw-build
        cmake --install glfw-build
        cp -f /mingw64/lib/libglfw3dll.a /mingw64/lib/libglfw3.dll.a 2>/dev/null || true
        rm -rf glfw-3.5.1 glfw-build glfw-3.5.1.tar.gz

    - name: Download, Patch, and Build Core OF
      run: |
        curl -L -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
        unzip -q of.zip
        mv of_v0.12.0_msys2_mingw64_release openFrameworks
        rm -f of.zip
        cd openFrameworks/scripts/msys2

        sed -i 's/FreeImage/freeimage/g' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*rtaudio[^[:space:]]*//gI' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*libusb[^[:space:]]*//gI' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*poco[^[:space:]]*//gI' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*tools[^[:space:]]*//gI' install_dependencies.sh
        sed -i -E 's/[^[:space:]]*glfw[^[:space:]]*//gI' install_dependencies.sh

        pacman -Su --noconfirm
        ./install_dependencies.sh --noconfirm

        mkdir -p /mingw64/lib/pkgconfig
        cat << 'EOF' > /mingw64/lib/pkgconfig/glm.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: GLM
        Description: OpenGL Mathematics
        Version: 1.0.3
        Cflags: -I${includedir}
        EOF

        cat << 'EOF' > /mingw64/lib/pkgconfig/rtaudio.pc
        prefix=/mingw64
        includedir=${prefix}/include
        Name: rtaudio
        Description: RtAudio dummy
        Version: 5.2.0
        Libs:
        Cflags:
        EOF
        ar cr /mingw64/lib/librtaudio.a

        find ../../libs/openFrameworksCompiled/ -type f -name "*.mk" -exec sed -i -E 's/[^[:space:]]*rtaudio[^[:space:]]*//gI' {} +
        find ../../libs/openFrameworks/ -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#define OF_SOUNDSTREAM_RTAUDIO/\/\/#define OF_SOUNDSTREAM_RTAUDIO/g' {} +

        echo "#if 0" > temp_rt.cpp
        cat ../../libs/openFrameworks/sound/ofRtAudioSoundStream.cpp >> temp_rt.cpp
        echo "#endif" >> temp_rt.cpp
        mv temp_rt.cpp ../../libs/openFrameworks/sound/ofRtAudioSoundStream.cpp

        cat << 'EOF' > ../../libs/openFrameworks/sound/ofRtAudioSoundStream.h
        #pragma once
        #include "ofBaseSoundStream.h"
        class ofRtAudioSoundStream : public ofBaseSoundStream {
        public:
            bool setup(const ofSoundStreamSettings& settings) override { return true; }
            void start() override {}
            void stop() override {}
            void close() override {}
            uint64_t getTickCount() const override { return 0; }
            int getNumInputChannels() const override { return 0; }
            int getNumOutputChannels() const override { return 0; }
            int getSampleRate() const override { return 44100; }
            int getBufferSize() const override { return 512; }
            std::vector<ofSoundDevice> getDeviceList(ofSoundDevice::Api) const override { return {}; }
            void setDeviceID(int) override {}
            void setInDeviceID(int) override {}
            void setOutDeviceID(int) override {}
        };
        EOF

        echo "PLATFORM_CXXFLAGS += -DGLM_ENABLE_EXPERIMENTAL" >> ../../libs/openFrameworksCompiled/project/makefileCommon/config.shared.mk
        cd ../../libs/openFrameworksCompiled/project
        make Release -j4

    - name: Clean MSYS2 Cache
      run: |
        pacman -Scc --noconfirm
        rm -rf /tmp/*

    - name: Archive Toolchain
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $msysPath = "${{ steps.msys2.outputs.msys2-location }}"

        & "C:\Program Files\Git\usr\bin\tar.exe" --force-local -cf "$env:RUNNER_TEMP\msys64.tar" -C $msysPath .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        7z a -mx=5 -mmt=on "$env:RUNNER_TEMP\msys64-mingw64.tar.7z" "$env:RUNNER_TEMP\msys64.tar"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item "$env:RUNNER_TEMP\msys64.tar"

        & "C:\Program Files\Git\usr\bin\tar.exe" --force-local -cf "$env:RUNNER_TEMP\of.tar" -C "$env:GITHUB_WORKSPACE\openFrameworks" .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        7z a -mx=5 -mmt=on "$env:RUNNER_TEMP\openFrameworks-0.12.0-mingw64.tar.7z" "$env:RUNNER_TEMP\of.tar"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item "$env:RUNNER_TEMP\of.tar"

    - name: Upload Frozen Toolchain to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="toolchain-mingw64-v1"
        if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
          gh release upload "$TAG" -R "${{ github.repository }}" \
            "$RUNNER_TEMP/msys64-mingw64.tar.7z" \
            "$RUNNER_TEMP/openFrameworks-0.12.0-mingw64.tar.7z" \
            --clobber
        else
          gh release create "$TAG" -R "${{ github.repository }}" \
            "$RUNNER_TEMP/msys64-mingw64.tar.7z" \
            "$RUNNER_TEMP/openFrameworks-0.12.0-mingw64.tar.7z" \
            --prerelease \
            --title "Frozen Windows Toolchain (MINGW64 + OF 0.12.0)" \
            --notes "Self-contained MSYS2 MINGW64 + openFrameworks 0.12.0 + GLFW 3.5.1 snapshot."
        fi